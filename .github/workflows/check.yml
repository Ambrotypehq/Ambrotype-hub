name: Check looks
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every item is valid and in the right folder, and index.json is current
        run: python3 tools/build_index.py --check
  # Every item installed as the Ambrotype app installs it: checksums, the
  # format of each kind (a theme's colours, a layout's panels, a collage's
  # cells...), a plugin's manifest and module, an interface's files.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub
      - uses: actions/checkout@v4
        with:
          repository: shardpelt/Ambrotype
          path: app
      - name: The app's system libraries
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build the app
        run: cargo build --manifest-path app/Cargo.toml -p amb-gui
      - name: Every item installs
        run: app/target/debug/ambrotype --check-hub hub
